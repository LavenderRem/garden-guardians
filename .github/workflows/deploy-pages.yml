name: 发布到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 获取源码
        uses: actions/checkout@v6
      - name: 设置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: 设置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 运行规则测试
        run: pnpm test
      - name: 构建发布文件
        run: pnpm run build:pages
      - name: 上传网站文件
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布网站
        id: deployment
        uses: actions/deploy-pages@v4
